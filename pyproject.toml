[project]
name = "light-obsidian-mcp"
version = "0.4.1"
description = "Light MCP server for Obsidian vault — no plugins, no open app required"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.20.0,<2.0.0",
    "pyyaml",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Craide/light-obsidian-mcp"

[project.scripts]
light-obsidian-mcp = "light_obsidian_mcp.server:main"
